name: Release

on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate-tag:
    name: Validate release tag and main tip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Validate tag, exact main tip, and changelog
        run: |
          version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "ferricml") | .version')"
          test "${GITHUB_REF_NAME}" = "v${version}"
          git fetch --no-tags origin main:refs/remotes/origin/main
          tag_commit="$(git rev-list -n 1 "refs/tags/${GITHUB_REF_NAME}")"
          test "${tag_commit}" = "$(git rev-parse origin/main)"
          grep --fixed-strings "## [${version}]" CHANGELOG.md

  rust-and-package:
    name: Full Rust and packaged-crate gates
    needs: validate-tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust components
        run: rustup component add clippy rustfmt
      - name: Full Rust gate
        run: make gate-full
      - name: Explicit packaged-crate gate
        run: make package-check

  public-api:
    name: Exact Rust public API
    needs: validate-tag
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Validate profiles and install pinned nightly
        run: |
          python3 scripts/rust_api_profiles.py validate
          nightly="$(python3 scripts/rust_api_profiles.py value nightly)"
          rustup toolchain install "$nightly" --profile minimal
      - name: Install pinned cargo-public-api
        run: |
          version="$(python3 scripts/rust_api_profiles.py value cargo_public_api_version)"
          cargo +stable install cargo-public-api --locked --version "$version"
      - name: Diff exact public API surface
        run: make api-check

  reference-contract:
    name: Frozen reference semantics
    needs: validate-tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify frozen behavior and quality contract
        run: make reference-check

  publish-crate:
    name: Publish crate
    needs: [rust-and-package, public-api, reference-contract]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          test -n "${CARGO_REGISTRY_TOKEN}"
          cargo publish --locked

  github-release:
    name: Create GitHub release
    needs: publish-crate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "${GITHUB_REF_NAME}" --verify-tag --generate-notes --title "FerricML ${GITHUB_REF_NAME#v}"

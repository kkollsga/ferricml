name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Preserve authoritative pushes to main; only superseded PR runs cancel.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  rust:
    name: Rust and packaged-crate checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust components
        run: rustup component add clippy rustfmt
      - name: Full Rust and extracted-package gate
        run: make gate-full

  public-api:
    name: Exact Rust public API
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Validate profiles and install pinned nightly
        run: |
          python3 scripts/rust_api_profiles.py validate
          nightly="$(python3 scripts/rust_api_profiles.py value nightly)"
          rustup toolchain install "$nightly" --profile minimal
      - name: Install pinned cargo-public-api
        run: |
          version="$(python3 scripts/rust_api_profiles.py value cargo_public_api_version)"
          cargo +stable install cargo-public-api --locked --version "$version"
      - name: Diff exact public API surface
        run: make api-check

  msrv:
    name: Minimum supported Rust version
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      # Read the floor out of Cargo.toml rather than repeating it here. A lane
      # with its own hardcoded copy of the version passes happily after someone
      # raises `rust-version`, which is the one thing it exists to catch.
      - name: Resolve the declared floor
        id: floor
        run: |
          set -euo pipefail
          version="$(cargo metadata --locked --format-version 1 --no-deps \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["rust_version"])')"
          if [ -z "$version" ] || [ "$version" = "None" ]; then
            echo "ferricml declares no rust-version; the floor is unguarded" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Declared MSRV: $version"
      - name: Install the declared floor
        run: rustup toolchain install "${{ steps.floor.outputs.version }}" --profile minimal
      # Build and test only. Clippy and rustfmt are deliberately absent: their
      # output moves between releases independently of what a consumer can
      # compile, so linting here would pin the floor to whichever toolchain the
      # lints happen to like. `make gate-full` on the `rust` job owns lint.
      - name: Build and test on the declared floor
        run: |
          set -euo pipefail
          toolchain="${{ steps.floor.outputs.version }}"
          cargo "+$toolchain" build --locked --all-targets
          cargo "+$toolchain" test --locked

  reference-contract:
    name: Frozen reference semantics
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify frozen behavior and quality contract
        run: make reference-check

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Preserve authoritative pushes to main; only superseded PR runs cancel.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  rust:
    name: Rust and packaged-crate checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust components
        run: rustup component add clippy rustfmt
      - name: Full Rust and extracted-package gate
        run: make gate-full

  public-api:
    name: Exact Rust public API
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Validate profiles and install pinned nightly
        run: |
          python3 scripts/rust_api_profiles.py validate
          nightly="$(python3 scripts/rust_api_profiles.py value nightly)"
          rustup toolchain install "$nightly" --profile minimal
      - name: Install pinned cargo-public-api
        run: |
          version="$(python3 scripts/rust_api_profiles.py value cargo_public_api_version)"
          cargo +stable install cargo-public-api --locked --version "$version"
      - name: Diff exact public API surface
        run: make api-check

  sklearn-conformance:
    name: scikit-learn conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/sklearn-conformance.txt
      - name: Install pinned reference environment
        run: python -m pip install --requirement requirements/sklearn-conformance.txt
      - name: Verify frozen public-API fixture
        run: python scripts/sklearn_conformance.py

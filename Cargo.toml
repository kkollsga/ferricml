[package]
name = "ferricml"
version = "0.1.2"
edition = "2024"
description = "A lean, pure-Rust toolkit for classical machine learning"
license = "MIT"
repository = "https://github.com/kkollsga/ferricml"
homepage = "https://github.com/kkollsga/ferricml"
documentation = "https://docs.rs/ferricml"
readme = "README.md"
keywords = ["machine-learning", "random-forest", "classification", "regression"]
categories = ["algorithms", "science"]
# `/docs` is deliberately absent: the narrative markdown ships, because it is
# the crate's only offline documentation and because `src/lib.rs` compiles those
# pages as doctests, so excluding them would remove the files that prove the
# samples still work. Every piece of documentation-site machinery lives outside
# `docs/` and is excluded here instead.
# `scripts/check_packaged_crate.sh` asserts both halves of that rule against the
# extracted archive.
exclude = [
    "/.cargo",
    "/.github",
    "/.readthedocs.yaml",
    "/.venv-docs",
    "/CLAUDE.md",
    "/Makefile",
    "/RELEASING.md",
    "/benches",
    "/benchmarks",
    "/dev-docs",
    "/mkdocs.yml",
    "/research",
    "/requirements",
    "/scripts",
    "/site",
    "/tests",
]

[features]
default = []

[dependencies]
nalgebra = { version = "0.34", default-features = false, features = ["std"] }
sha2 = "0.10"

[dev-dependencies]
criterion = { version = "0.7", default-features = false }
tempfile = "3"

[[bench]]
name = "forest"
harness = false

[[bench]]
name = "models"
harness = false

[[bench]]
name = "boosting"
harness = false

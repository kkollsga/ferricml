[package]
name = "ferricml"
version = "0.2.0"
edition = "2024"
# Measured rather than assumed, on 2026-07-26, against this committed
# `Cargo.lock`. Both halves of the floor were located by installing the
# candidate toolchains and building:
#
#   1.85 / 1.86  Cargo refuses to resolve: `nalgebra 0.34.2` declares
#                `rust-version = "1.87.0"`, the highest in the locked graph.
#   1.87         Resolves, then fails to compile the crate's own source with 16
#                instances of `error[E0658]: let expressions in this position
#                are unstable`, over 15 sites in `src/tree`, `src/linear_model`,
#                `src/ensemble`, and `src/preprocessing`. `let` chains
#                stabilized in 1.88 on edition 2024, so the crate's source is
#                what sets the floor, not the dependency graph.
#   1.88         Builds and passes the full default test suite.
#
# `1.85` — the first toolchain carrying `edition = "2024"` at all — is therefore
# the floor this crate *could* have had, not the floor it has. The
# `msrv` CI lane in `.github/workflows/ci.yml` builds and tests on exactly this
# version so raising it has to be a decision rather than an accident.
#
# Build and test agree on 1.88; clippy does not, and the lane deliberately does
# not run it. `clippy::nonminimal_bool` reports
# `src/preprocessing/robust_scaler/mod.rs:103` on 1.88, 1.90 and 1.92 and stops
# reporting it on 1.97. Lint output is not a compatibility contract, and pinning
# the floor to whichever clippy is quietest would raise the version a consumer
# needs for no reason a consumer can observe.
rust-version = "1.88"
description = "A lean, pure-Rust toolkit for classical machine learning"
license = "MIT"
repository = "https://github.com/kkollsga/ferricml"
homepage = "https://github.com/kkollsga/ferricml"
documentation = "https://docs.rs/ferricml"
readme = "README.md"
keywords = ["machine-learning", "random-forest", "classification", "regression"]
categories = ["algorithms", "science"]
# `/docs` is deliberately absent: the narrative markdown ships, because it is
# the crate's only offline documentation and because `src/lib.rs` compiles those
# pages as doctests, so excluding them would remove the files that prove the
# samples still work. Every piece of documentation-site machinery lives outside
# `docs/` and is excluded here instead.
# `scripts/check_packaged_crate.sh` asserts both halves of that rule against the
# extracted archive, and reads the list below rather than repeating it, so this
# is the one place a development-only path has to be named.
exclude = [
    "/.cargo",
    "/.github",
    "/.readthedocs.yaml",
    "/.venv-docs",
    "/CLAUDE.md",
    "/Makefile",
    "/RELEASING.md",
    "/benches",
    "/benchmarks",
    "/dev-docs",
    "/mkdocs.yml",
    "/research",
    "/requirements",
    "/scripts",
    "/site",
    "/tests",
]

# Pinned so `bench-history` compares code rather than codegen placement.
# `[profile.bench]` inherits from this, so both measured profiles agree.
#
# Decided on a four-run sweep (16 and 1 codegen units, two cycles each, 111
# lanes, 2026-07-26). Cycle-to-cycle reproducibility on identical code improves
# from p50 2.50% / p90 13.08% to p50 0.66% / p90 4.16%; lanes reproducing within
# 1% go from 32 to 68 of 111. That is the whole reason: at 16 units a tenth of
# the suite cannot reproduce itself inside the 1.10 ratio limit it is judged
# against, so the gate could not tell a measurement artifact from a regression.
#
# It buys comparability, not speed, and the cost is recorded rather than hidden:
# the median lane is 0.9% faster but 37 of 111 are slower, worst being boosted
# `predict_proba` at +16.3% and the calibration paths at +8.5-10.9%. Build time
# was not measurably different across the sweep. Profiles apply only to the
# crate being built, so a downstream consumer's build is unaffected.
[profile.release]
codegen-units = 1

[features]
default = []

[dependencies]
# The crate's one dense linear-algebra backend, and not a preference: it
# replaced `nalgebra 0.34.2`, whose `svd(true, true)` returns a decomposition
# that does not reconstruct its own input on exactly-rank-deficient tall
# designs. See the changelog entry for the measurement.
#
# `default-features = false` keeps the sparse, `rand` and `npy` graph out; `std`
# is what enables the runtime CPU-feature detection the kernels dispatch on.
#
# `rayon` is deliberately absent, and that is a verified choice rather than an
# omission: `faer::Par::Seq`, `set_global_parallelism` and every decomposition
# FerricML needs compile and run with exactly the features named here, so the
# crate pins sequential execution without ever linking a thread pool. Cargo
# feature unification can still switch `rayon` on from elsewhere in a consumer's
# graph, which is why `least_squares.rs` pins `Par::Seq` at each fit rather than
# inferring it from this line.
faer = { version = "0.24.4", default-features = false, features = ["std"] }
sha2 = "0.10"

[dev-dependencies]
criterion = { version = "0.7", default-features = false }
tempfile = "3"

[[bench]]
name = "forest"
harness = false

[[bench]]
name = "models"
harness = false

[[bench]]
name = "boosting"
harness = false
